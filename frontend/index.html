<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FRNDLY membantu bisnis konveksi mengelola produk custom, pesanan, pembayaran, produksi, invoice, dan pengiriman dalam satu aplikasi." />
    <meta name="theme-color" content="#05070c" />
    <meta property="og:title" content="FRNDLY — Apparel Custom & Business Control Center" />
    <meta property="og:description" content="Dari ide hingga produk jadi—jelajahi layanan apparel custom dan kelola operasional bisnis konveksi bersama FRNDLY." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>FRNDLY — Business Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('frndly_theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
